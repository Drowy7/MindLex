# MindLex API — конфигурация по методологии 12 факторов.
# Фактор III (Config): все изменяемые значения читаются из переменных окружения,
# в репозитории лежат только безопасные значения по умолчанию для локального запуска.
spring:
  application:
    name: mindlex-api

  # Фактор IV (Backing services): PostgreSQL подключается как внешний ресурс по URL.
  datasource:
    url: ${MINDLEX_DB_URL:jdbc:postgresql://localhost:5432/mindlex}
    username: ${MINDLEX_DB_USER:mindlex}
    password: ${MINDLEX_DB_PASSWORD:mindlex}
    hikari:
      maximum-pool-size: ${MINDLEX_DB_POOL_SIZE:10}
      minimum-idle: ${MINDLEX_DB_POOL_MIN_IDLE:2}
      pool-name: mindlex-pool
      connection-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 30
        order_inserts: true

  # Фактор XII (Admin processes): миграции схемы — отдельный процесс, а не часть рантайма.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  lifecycle:
    timeout-per-shutdown-phase: 20s

# Фактор VII (Port binding): порт берётся из окружения, приложение само публикует HTTP.
server:
  port: ${PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json
  error:
    include-message: always

# Фактор IX (Disposability): health-пробы для оркестратора.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: MindLex API
    version: 1.0.0
    description: REST-бэкенд приложения для изучения иностранной лексики

# Фактор XI (Logs): журнал пишется в stdout потоком событий, файлы не используются.
# Формат задан в logback-spring.xml: структурированный JSON (поля timestamp, level, message,
# service.name, logger_name, thread_name, request_id), при профиле plain — текстовый шаблон.
logging:
  level:
    root: ${MINDLEX_LOG_LEVEL:INFO}
    ru.mindlex: ${MINDLEX_APP_LOG_LEVEL:INFO}

mindlex:
  jwt:
    # В продакшене секрет обязан приходить из окружения (см. .env.example)
    secret: ${MINDLEX_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    issuer: ${MINDLEX_JWT_ISSUER:mindlex}
    ttl: ${MINDLEX_JWT_TTL:PT12H}
  cors:
    allowed-origins: ${MINDLEX_CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8081}
  practice:
    new-words-per-session: ${MINDLEX_NEW_WORDS_LIMIT:50}
    rush-seconds: ${MINDLEX_RUSH_SECONDS:90}
    cloze-seconds: ${MINDLEX_CLOZE_SECONDS:35}
  demo-user:
    # Демонстрационный пользователь создаётся административным процессом при старте.
    enabled: ${MINDLEX_DEMO_USER_ENABLED:true}
